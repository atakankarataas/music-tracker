name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        # The build only needs to resolve and compile; it must never reach the
        # real database, so no DB secret is provided to this step.
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  ingest:
    name: Ingest (Python tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q tracker.py metadata_backfill.py token_al.py ingest
